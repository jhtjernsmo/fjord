name: Release

# Push a tag like v0.1.0 to build installers for Linux, Windows and macOS.
# The result is a *draft* GitHub Release — review it, then click Publish.
# Builds are signed for the in-app updater (secrets TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]);
# tauri-action uploads latest.json, which installed apps read once the release is published.
# macOS apps are code-signed with the Developer ID certificate and notarized by Apple
# (secrets APPLE_CERTIFICATE[_PASSWORD], APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    name: App (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04 # older glibc = AppImage/.deb run on more distros
            args: ''
          - name: Windows
            os: windows-latest
            args: ''
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm --prefix ui ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS only (ignored elsewhere): sign with Developer ID, then notarize.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tauriScript: npx --prefix ui tauri
          args: --config src-tauri/tauri.updater.conf.json ${{ matrix.args }}
          includeUpdaterJson: true
          tagName: ${{ github.ref_name }}
          releaseName: Fjord ${{ github.ref_name }}
          releaseBody: |
            Local-first project management — Linux first, also on Windows & macOS.
            See the README for install notes. macOS builds are signed and notarized by Apple.
            Windows builds are not code-signed yet, so SmartScreen may show a warning.
          releaseDraft: true
          prerelease: false # the updater only sees the latest non-prerelease

  cli:
    name: CLI (${{ matrix.name }})
    needs: app
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: '' }
          - { name: Windows, os: windows-latest, target: x86_64-pc-windows-msvc, ext: '.exe' }
          - { name: macOS, os: macos-latest, target: aarch64-apple-darwin, ext: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p fjord-cli --target ${{ matrix.target }}
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="fjord-cli-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/fjord${{ matrix.ext }}" "$out"
          gh release upload "${{ github.ref_name }}" "$out" --clobber
