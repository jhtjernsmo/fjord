[package]
name = "fjord-cli"
version = "0.2.8"
edition = "2024"
description = "Command-line interface and MCP server for Fjord"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jhtjernsmo/fjord"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fjord-core = { version = "0.2.8", path = "../fjord-core" }
fjord-vcs = { version = "0.2.8", path = "../fjord-vcs" }
serde = "1.0.229"
serde_json = "1.0.151"

[[bin]]
name = "fjord"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
