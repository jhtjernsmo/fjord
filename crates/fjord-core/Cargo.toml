[package]
name = "fjord-core"
version = "0.2.5"
edition = "2024"
description = "Core library for Fjord: local-first project management on SQLite"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jhtjernsmo/fjord"

[dependencies]
dirs = "7.0.0"
hex = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
